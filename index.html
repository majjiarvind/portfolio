<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Majji Arvind Kumar — Technical Product Owner</title>
<meta name="description" content="Technical Product Owner supporting Ericsson R&D's Network Manager platform via TCS. Agile delivery, telecom NMS, AI-assisted product workflows.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1220'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='700' font-size='26' text-anchor='middle' fill='%23F2A93C'%3EAM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --surface:#121B2E;
    --surface-2:#0E1727;
    --line:#223049;
    --text:#E8ECF3;
    --muted:#8B96AB;
    --amber:#F2A93C;
    --mint:#3DDC97;
    --radius:10px;
    --maxw:960px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(242,169,60,0.09), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(61,220,151,0.07), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mint);
    display:flex; align-items:center; gap:8px;
    margin-bottom:14px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--mint); flex:none;}
  @media (prefers-reduced-motion: no-preference){
    .dot.pulse{ animation:pulse 2.2s ease-in-out infinite; }
    @keyframes pulse{
      0%,100%{ box-shadow:0 0 0 0 rgba(61,220,151,.5); }
      50%{ box-shadow:0 0 0 5px rgba(61,220,151,0); }
    }
  }

  :focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }

  /* NAV */
  header.nav{
    position:sticky; top:0; z-index:20;
    backdrop-filter:blur(10px);
    background:rgba(11,18,32,0.75);
    border-bottom:1px solid var(--line);
  }
  .navrow{display:flex; align-items:center; justify-content:space-between; padding:16px 24px;}
  .brand{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; letter-spacing:.01em;}
  .brand span{color:var(--amber);}
  nav.links{display:flex; gap:22px; font-size:13px; color:var(--muted);}
  nav.links a{text-decoration:none; transition:color .15s;}
  nav.links a:hover{color:var(--text);}
  .navcta{
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    border:1px solid var(--line); padding:7px 14px; border-radius:6px;
    text-decoration:none; color:var(--text); transition:border-color .15s, background .15s;
  }
  .navcta:hover{border-color:var(--amber); background:rgba(242,169,60,0.08);}
  .nav-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:6px; transition:border-color .15s, background .15s;
  }
  .icon-btn:hover{border-color:var(--mint); background:rgba(61,220,151,0.08);}
  .icon-btn svg{width:16px; height:16px; fill:var(--text);}

  /* HERO */
  .hero{padding:76px 0 40px; position:relative; overflow:hidden;}
  .hero-bg{
    position:absolute; inset:-40px -24px auto -24px; height:460px;
    background-image:radial-gradient(circle, rgba(139,150,171,0.16) 1px, transparent 1.4px);
    background-size:26px 26px;
    -webkit-mask-image:linear-gradient(to bottom, black 0%, black 55%, transparent 100%);
    mask-image:linear-gradient(to bottom, black 0%, black 55%, transparent 100%);
    pointer-events:none; z-index:0;
  }
  .hero-sweep{
    position:absolute; inset:-40px -24px auto -24px; height:460px;
    background:linear-gradient(180deg, transparent 0%, rgba(61,220,151,0.10) 45%, transparent 60%);
    pointer-events:none; z-index:0;
  }
  .hero-packet{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:var(--mint); opacity:0; pointer-events:none; z-index:0;
    box-shadow:0 0 6px 1px rgba(61,220,151,0.6);
  }
  @media (prefers-reduced-motion:no-preference){
    .hero-sweep{ animation:sweep 7s ease-in-out infinite; }
    @keyframes sweep{
      0%{ transform:translateY(-70%); }
      100%{ transform:translateY(70%); }
    }
    .hero-packet{ animation:packetDrift linear infinite; }
    @keyframes packetDrift{
      0%{ opacity:0; transform:translate(0,0); }
      8%{ opacity:.9; }
      92%{ opacity:.7; }
      100%{ opacity:0; transform:translate(var(--dx,60px), var(--dy,-160px)); }
    }
  }
  @media (prefers-reduced-motion:reduce){
    .hero-sweep, .hero-packet{ display:none; }
  }
  .hero > .hero-grid{ position:relative; z-index:1; }
  .hero-grid{display:grid; grid-template-columns:1fr auto; gap:36px; align-items:start;}
  @media (max-width:700px){ .hero-grid{grid-template-columns:1fr;} }
  .hero-photo{
    width:132px; height:132px; border-radius:50%; overflow:hidden; flex:none;
    border:2px solid var(--line); box-shadow:0 0 0 6px rgba(242,169,60,0.06);
  }
  .hero-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  @media (max-width:700px){ .hero-photo{width:96px; height:96px; order:-1; margin-bottom:8px;} }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(34px,5.4vw,54px);
    line-height:1.05;
    margin:0 0 16px;
    letter-spacing:-.01em;
  }
  h1 .accent{color:var(--amber);}
  .lede{
    font-size:17px; color:var(--muted); max-width:600px; margin:0 0 34px;
  }
  .lede strong{color:var(--text); font-weight:500;}
  .hero-ctas{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:40px;}
  .btn{
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    padding:11px 18px; border-radius:7px; text-decoration:none;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .12s, border-color .15s, background .15s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--amber); color:#0B1220; font-weight:500;}
  .btn-primary:hover{background:#ffc266;}
  .btn-ghost{border:1px solid var(--line); color:var(--text);}
  .btn-ghost:hover{border-color:var(--mint); background:rgba(61,220,151,0.08);}

  /* KPI STRIP */
  .kpis{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:56px;
  }
  .kpi{background:var(--surface); padding:20px 18px;}
  .kpi .label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin-bottom:10px;
    display:flex; align-items:center; gap:7px;
  }
  .kpi .stat-dot{width:5px;height:5px;border-radius:50%;background:var(--mint); flex:none;}
  .kpi .value{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(22px,3vw,30px); color:var(--text);
  }
  .kpi .value small{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted); font-weight:400;}
  @media (max-width:640px){ .kpis{grid-template-columns:1fr;} }

  /* SIGNATURE: role topology */
  section.topology{padding:20px 0 70px;}
  .section-head{margin-bottom:28px;}
  h2{
    font-family:'Space Grotesk',sans-serif; font-weight:600;
    font-size:22px; margin:0 0 8px;
  }
  .section-sub{color:var(--muted); font-size:14.5px; max-width:560px;}
  .topo-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 20px 20px;
  }
  svg.topomap{width:100%; height:auto; display:block;}
  .topo-node text{font-family:'IBM Plex Mono',monospace; fill:var(--text);}
  .topo-node .sub{fill:var(--muted);}
  .topo-line{stroke:var(--line); stroke-width:1.4; fill:none;}
  @media (prefers-reduced-motion:no-preference){
    .topo-line.live{
      stroke-dasharray:4 5;
      animation:flow 2.4s linear infinite;
    }
    @keyframes flow{ to{ stroke-dashoffset:-90; } }
  }
  .topo-core rect{fill:var(--surface-2); stroke:var(--amber); stroke-width:1.4;}
  .topo-domain rect{fill:var(--surface-2); stroke:var(--mint); stroke-width:1.2;}
  .topo-tool rect{fill:var(--surface-2); stroke:#5B8CFF; stroke-width:1.2;}
  .topo-people rect{fill:var(--surface-2); stroke:var(--muted); stroke-width:1.1;}
  .legend{display:flex; flex-wrap:wrap; gap:18px; margin-top:18px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted);}
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .legend i{width:9px;height:9px;border-radius:2px; display:inline-block;}

  /* interactive topology states */
  .topo-node{cursor:pointer;}
  .topo-node rect{transition:opacity .25s, stroke-width .2s, filter .2s;}
  .topo-node text{transition:opacity .25s;}
  .topo-line{transition:opacity .3s;}
  .topo-node.dim rect{opacity:.25;}
  .topo-node.dim text{opacity:.3;}
  .topo-line.dim{opacity:.12;}
  .topo-node.active rect{stroke-width:2.6; filter:drop-shadow(0 0 6px rgba(242,169,60,0.35));}
  .topo-node:hover rect{stroke-width:2.2;}
  .topo-node:focus-visible rect{outline:2px solid var(--amber); outline-offset:2px;}
  .topo-detail{
    margin-top:18px; padding:16px 18px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; min-height:64px;
  }
  .topo-detail-tag{
    display:inline-block; font-size:10.5px; letter-spacing:.08em; color:var(--amber);
    margin-bottom:8px;
  }
  .topo-detail p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.6;}

  /* scroll reveal */
  .reveal{opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1; transform:none;}
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1; transform:none; transition:none;}
  }

  /* scrollspy */
  nav.links a.current{color:var(--mint);}

  /* ABOUT */
  section.about{padding:20px 0 70px;}
  .about-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:40px;}
  @media (max-width:760px){ .about-grid{grid-template-columns:1fr;} }
  .about p{color:var(--muted); font-size:15px; margin:0 0 16px;}
  .about p strong{color:var(--text); font-weight:500;}
  .sidecard{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px;
  }
  .sidecard h3{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--mint); margin:0 0 14px;
  }
  .sidecard ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .sidecard li{font-size:13.5px; color:var(--muted); display:flex; gap:9px;}
  .sidecard li::before{content:"▸"; color:var(--amber); flex:none;}

  /* TIMELINE */
  section.timeline{padding:20px 0 70px;}
  .tl-item{
    display:grid; grid-template-columns:150px 1fr; gap:20px;
    padding:22px 0; border-top:1px solid var(--line);
  }
  .tl-item:last-child{border-bottom:1px solid var(--line);}
  @media (max-width:600px){ .tl-item{grid-template-columns:1fr;} }
  .tl-date{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--amber);}
  .tl-role{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:17px; margin:0 0 4px;}
  .tl-org{color:var(--muted); font-size:13.5px; margin:0 0 10px;}
  .tl-desc{color:var(--muted); font-size:14px; margin:0;}

  /* SKILLS */
  section.skills{padding:20px 0 70px;}
  .skill-groups{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
  @media (max-width:640px){ .skill-groups{grid-template-columns:1fr;} }
  .skill-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 18px 16px;}
  .skill-card h4{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:0 0 12px;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-size:12.5px; padding:6px 10px; border-radius:6px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
  }

  /* IMPACT STRIP */
  section.impact{padding:0 0 60px;}
  .impact-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 24px;
  }
  .impact-list{display:grid; grid-template-columns:1fr 1fr; gap:10px 28px; margin:0; padding:0; list-style:none;}
  @media (max-width:640px){ .impact-list{grid-template-columns:1fr;} }
  .impact-list li{
    display:flex; align-items:flex-start; gap:10px; font-size:14px; color:var(--text); line-height:1.5;
  }
  .impact-list li .dot2{
    width:7px; height:7px; border-radius:50%; margin-top:7px; flex:none;
  }
  .impact-list li strong{font-weight:600;}

  /* CASE STUDIES */
  section.cases{padding:20px 0 70px;}
  .case-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:860px){ .case-grid{grid-template-columns:1fr;} }
  .case-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; display:flex; flex-direction:column; gap:12px;
  }
  .case-tag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--mint); align-self:flex-start; border:1px solid rgba(61,220,151,0.35);
    padding:3px 8px; border-radius:5px;
  }
  .case-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16.5px; margin:0;}
  .case-block h5{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:0 0 4px;
  }
  .case-block p{font-size:13.5px; color:var(--muted); margin:0;}
  .case-block strong{color:var(--text); font-weight:500;}

  /* SEEKING */
  section.seeking{padding:20px 0 70px;}
  .seeking-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px; display:flex; flex-wrap:wrap; align-items:center; gap:20px; justify-content:space-between;
  }
  .role-chips{display:flex; flex-wrap:wrap; gap:10px;}
  .role-chip{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    padding:8px 14px; border-radius:20px; border:1px solid var(--amber);
    color:var(--text); background:rgba(242,169,60,0.08);
  }

  /* TESTIMONIAL */
  section.testimonial{padding:20px 0 70px;}
  .quote-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; border-left:3px solid var(--mint);
  }
  .quote-card p.q{font-size:15.5px; color:var(--text); font-style:italic; margin:0 0 12px;}
  .quote-card p.attr{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted); margin:0;}

  /* CERTS */
  section.certs{padding:20px 0 70px;}
  .cert-row{display:flex; flex-wrap:wrap; gap:14px;}
  .cert{
    flex:1 1 260px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; font-size:13.5px; color:var(--muted);
  }
  .cert strong{display:block; color:var(--text); font-size:14.5px; font-weight:500; margin-bottom:4px;}

  /* FOOTER */
  footer{
    border-top:1px solid var(--line);
    padding:44px 0 60px;
  }
  .footer-grid{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:24px;}
  .footer-cta h2{margin-bottom:10px;}
  .contact-list{display:flex; flex-direction:column; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .contact-list a{text-decoration:none; color:var(--muted); transition:color .15s;}
  .contact-list a:hover{color:var(--mint);}
  .foot-note{color:var(--muted); font-size:12px; margin-top:30px;}

  /* ============================================================
     PREMIUM ENHANCEMENT LAYER
     Added on top of the existing design. Nothing above this
     block is modified — layout, colors, and copy are untouched.
     All effects below respect prefers-reduced-motion.
     ============================================================ */

  /* ---- 13. Page loader ---- */
  #pageLoader{
    position:fixed; inset:0; z-index:999;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .4s ease, visibility .4s ease;
  }
  #pageLoader .loader-mark{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;
    color:var(--text); opacity:0; letter-spacing:.02em;
  }
  #pageLoader .loader-mark span{color:var(--amber);}
  @media (prefers-reduced-motion:no-preference){
    #pageLoader .loader-mark{ animation:loaderReveal .6s ease .05s forwards; }
    @keyframes loaderReveal{
      0%{ opacity:0; transform:scale(.85); filter:blur(6px); }
      100%{ opacity:1; transform:scale(1); filter:blur(0); }
    }
  }
  #pageLoader.loaded{ opacity:0; visibility:hidden; pointer-events:none; }
  @media (prefers-reduced-motion:reduce){
    #pageLoader{ display:none; }
  }

  /* ---- 14. Scroll progress bar ---- */
  #scrollProgress{
    position:fixed; top:0; left:0; height:2.5px; width:0%;
    background:linear-gradient(90deg, var(--mint), var(--amber));
    z-index:1000; transition:width .1s linear;
  }

  /* ---- 11. Cursor glow (amber, desktop only) ---- */
  #cursorGlow{
    position:fixed; top:0; left:0; width:420px; height:420px;
    margin:-210px 0 0 -210px;
    background:radial-gradient(circle, rgba(242,169,60,0.10), transparent 65%);
    pointer-events:none; z-index:1; opacity:0;
    transition:opacity .3s ease;
    will-change:transform;
  }
  #cursorGlow.active{ opacity:1; }
  @media (hover:none), (pointer:coarse){ #cursorGlow{ display:none !important; } }
  @media (prefers-reduced-motion:reduce){ #cursorGlow{ display:none !important; } }

  /* ---- 15. Floating background particles ---- */
  #bgParticles{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  #bgParticles .particle{
    position:absolute; border-radius:50%;
    background:var(--mint); opacity:0.07;
  }
  @media (prefers-reduced-motion:no-preference){
    #bgParticles .particle{ animation:floatParticle linear infinite; }
    @keyframes floatParticle{
      0%{ transform:translateY(0) translateX(0); }
      50%{ transform:translateY(-40px) translateX(12px); }
      100%{ transform:translateY(0) translateX(0); }
    }
  }
  @media (prefers-reduced-motion:reduce){ #bgParticles{ display:none; } }

  /* ---- 1. Hero animated network ---- */
  .hero-network{
    position:absolute; inset:-40px -24px auto -24px; height:460px;
    z-index:0; pointer-events:none; opacity:.55;
  }
  .hero-network svg{ width:100%; height:100%; display:block; }
  .hero-network .net-line{
    stroke:var(--mint); stroke-width:1; fill:none; opacity:.28;
  }
  .hero-network .net-node{ fill:var(--mint); opacity:.75; }
  .hero-network .net-node.amber{ fill:var(--amber); }
  @media (prefers-reduced-motion:no-preference){
    .hero-network .net-node{ animation:nodePulse 3.4s ease-in-out infinite; }
    @keyframes nodePulse{
      0%,100%{ opacity:.55; r:2.6; }
      50%{ opacity:1; r:3.4; }
    }
  }
  @media (prefers-reduced-motion:reduce){
    .hero-network .net-packet{ display:none; }
  }

  /* ---- 2. Hero headline typewriter ---- */
  h1 .char{ display:inline-block; opacity:0; transform:translateY(6px); }
  @media (prefers-reduced-motion:no-preference){
    h1.typing .char{ animation:charIn .38s ease forwards; }
    @keyframes charIn{ to{ opacity:1; transform:translateY(0); } }
  }
  @media (prefers-reduced-motion:reduce){
    h1 .char{ opacity:1; transform:none; }
  }
  .typing-cursor{
    display:inline-block; width:2px; margin-left:2px; background:var(--amber);
    animation:blinkCursor .85s step-end infinite;
  }
  @keyframes blinkCursor{ 50%{ opacity:0; } }

  /* ---- 4. Scroll reveal upgrade (blur + scale + stagger) ---- */
  @media (prefers-reduced-motion:no-preference){
    .reveal{
      opacity:0; transform:translateY(40px) scale(.98);
      filter:blur(8px);
      transition:opacity .7s cubic-bezier(.22,.61,.36,1),
                 transform .7s cubic-bezier(.22,.61,.36,1),
                 filter .7s cubic-bezier(.22,.61,.36,1);
    }
    .reveal.in{ opacity:1; transform:none; filter:blur(0); }
    .reveal > * { opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease; }
    .reveal.in > *{ opacity:1; transform:none; }
  }

  /* ---- 3. KPI count-up entrance ---- */
  @media (prefers-reduced-motion:no-preference){
    .kpi{ opacity:0; transform:scale(.95); transition:opacity .5s ease, transform .5s ease; }
    .kpi.kpi-in{ opacity:1; transform:scale(1); }
  }

  /* ---- 5. Case study card tilt / glow ---- */
  .case-card{
    transform-style:preserve-3d; will-change:transform;
    transition:transform .18s ease, box-shadow .25s ease, border-color .25s ease;
    position:relative;
  }
  .case-card:hover{
    box-shadow:0 18px 40px -12px rgba(0,0,0,0.45);
    border-color:rgba(242,169,60,0.35);
  }
  .case-card::before{
    content:""; position:absolute; inset:-1px; border-radius:inherit;
    padding:1px; opacity:0; pointer-events:none; transition:opacity .25s ease;
    background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%), rgba(242,169,60,0.55), transparent 60%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  .case-card:hover::before{ opacity:1; }

  /* ---- 6. Buttons: ripple / arrow / glow / lift ---- */
  .btn{ position:relative; overflow:hidden; }
  .btn:hover{ transform:translateY(-3px); }
  .btn-primary:hover{ box-shadow:0 8px 24px -6px rgba(242,169,60,0.55); }
  .btn-ghost:hover{ box-shadow:0 8px 22px -8px rgba(61,220,151,0.35); }
  .btn::after{
    content:"→"; display:inline-block; margin-left:2px;
    transition:transform .2s ease; transform:translateX(0);
  }
  .btn:hover::after{ transform:translateX(4px); }
  .btn .ripple{
    position:absolute; border-radius:50%; background:rgba(255,255,255,0.35);
    transform:scale(0); animation:rippleAnim .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{ transform:scale(1); opacity:0; } }

  /* ---- 7. Navigation active underline ---- */
  nav.links a{ position:relative; }
  nav.links a::after{
    content:""; position:absolute; left:0; right:0; bottom:-6px; height:1.5px;
    background:var(--mint); transform:scaleX(0); transform-origin:left;
    transition:transform .25s ease;
  }
  nav.links a:hover::after, nav.links a.current::after{ transform:scaleX(1); }
  header.nav.scrolled{ background:rgba(11,18,32,0.92); }

  /* ---- 8. Skill chip pop-in ---- */
  @media (prefers-reduced-motion:no-preference){
    .chip{ opacity:0; transform:scale(.85); transition:opacity .4s ease, transform .4s cubic-bezier(.34,1.56,.64,1); }
    .chip.chip-in{ opacity:1; transform:scale(1); }
  }

  /* ---- 9. Timeline growing line + per-item fade ---- */
  section.timeline{ position:relative; }
  section.timeline::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:2px;
    background:var(--mint); opacity:.35; transform-origin:top;
    transform:scaleY(var(--tl-progress, 0));
    transition:transform .1s linear;
  }
  @media (prefers-reduced-motion:no-preference){
    .tl-item{ opacity:0; transform:translateY(24px); transition:opacity .6s ease, transform .6s ease; }
    .tl-item.in{ opacity:1; transform:none; }
  }

  /* ---- 10. Interactive topology extras ---- */
  .topo-node:hover rect{ filter:drop-shadow(0 0 8px rgba(61,220,151,0.55)); }
  .topo-node.topo-core:hover rect{ filter:drop-shadow(0 0 10px rgba(242,169,60,0.55)); }
  .topo-packet{ fill:var(--amber); }
  @media (prefers-reduced-motion:reduce){ .topo-packet{ display:none; } }

  /* ---- 12. Footer word-by-word reveal ---- */
  .footer-cta h2 .word{

    transition:opacity .45s ease, transform .45s ease;
  }
